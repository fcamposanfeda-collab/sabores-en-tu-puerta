# Genera la web estática en cada cambio de main y la deja, ya construida,
# en la rama `hostinger`. En hPanel > Advanced > Git, Hostinger debe desplegar
# esa rama (no main), porque Hostinger copia los archivos tal cual y no compila.
name: Publicar en Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-hostinger
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://saboresentupuerta.com
      # La clave de Web3Forms es pública por diseño: acaba igualmente en el HTML.
      NEXT_PUBLIC_WEB3FORMS_KEY: dab3b848-f218-4742-a907-3b263dff52b8
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.NEXT_PUBLIC_GSC_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publicar out/ en la rama hostinger
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: true
          commit_message: "Web generada desde"
